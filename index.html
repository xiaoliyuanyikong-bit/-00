
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学校用 席替えシステム 完成版</title>
<style>
:root{--main:#1976d2;--bg:#f4f6f8;--card:#fff;--danger:#d32f2f;--fixed:#43a047;--front:#ff9800;--empty:#999}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:"Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:#222}
h1{text-align:center;margin:0 0 18px}
h2,h3{margin:16px 0 8px}
.panel{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{border:none;border-radius:9px;padding:10px 14px;background:var(--main);color:#fff;cursor:pointer;font-size:14px}
button:hover{opacity:.9}
button.danger{background:var(--danger)}
button.gray{background:#607d8b}
input,select{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none!important}
.note{font-size:13px;color:#555;background:#eef5ff;border-left:4px solid var(--main);padding:8px;border-radius:6px}
#seatMap,#seatSelector{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.seat,.selectSeat{background:#fff;border:2px solid #ddd;border-radius:12px;min-height:78px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.selectSeat{min-height:56px;cursor:pointer;font-weight:bold}
.selectSeat:hover{background:#e3f2fd}
.selectedSeat{background:#1976d2!important;color:white;border-color:#1976d2!important}
.seatNo{color:#777;font-size:12px;margin-bottom:4px}
.studentNo{font-size:23px;font-weight:bold}
.emptySeat .studentNo{color:var(--empty)}
.fixedSeat{border-color:var(--fixed);background:#e8f5e9}
.frontSeat{border-color:var(--front);background:#fff8e1}
.animating{background:#ffeb3b!important;transform:scale(1.06);box-shadow:0 0 20px rgba(255,193,7,.8)}
.item{padding:8px;border-radius:8px;margin:6px 0;background:#f5f5f5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item button{padding:5px 9px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}
.legend span{background:white;padding:7px 10px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#animationArea{text-align:center;font-size:46px;font-weight:bold;padding:22px;margin:16px 0;background:#fff3cd;border:2px solid #ffc107;border-radius:12px}
.presentation{background:linear-gradient(135deg,#667eea,#764ba2)}
.presentation h1{color:white;font-size:46px}
.presentation .panel:first-of-type{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
.presentation .seat{min-height:95px;font-size:18px}
.presentation .studentNo{font-size:30px}

.presentation .fixedSeat,
.presentation .frontSeat{
  border-color:#ddd !important;
  background:white !important;
}
.presentation .legend{
  display:none !important;
}


/* 発表モードでは座席表全体が画面に収まるようにする */
.presentation{
  min-height:100vh;
  padding:8px;
  overflow:hidden;
}
.presentation h1{
  font-size:30px !important;
  margin-bottom:8px !important;
}
.presentation .panel{
  margin-bottom:8px;
  padding:8px;
}
.presentation .controls{
  justify-content:center;
}
.presentation #seatMap{
  height:calc(100vh - 150px);
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:1fr;
  gap:6px;
  margin:0 auto;
  max-width:1200px;
}
.presentation .seat{
  min-height:0 !important;
  height:100%;
  padding:4px;
}
.presentation .seatNo{
  font-size:11px;
  margin-bottom:2px;
}
.presentation .studentNo{
  font-size:clamp(18px,3.2vw,34px) !important;
}
.presentation #animationArea{
  font-size:28px;
  padding:8px;
  margin:6px 0;
}
@media(max-width:700px){
  .presentation{
    overflow:auto;
  }
  .presentation #seatMap{
    height:auto;
    grid-template-columns:repeat(3,1fr);
  }
  .presentation .seat{
    min-height:70px !important;
  }
}

@media(max-width:700px){body{padding:10px}.row{grid-template-columns:1fr}#seatMap,#seatSelector{grid-template-columns:repeat(3,1fr)}.presentation h1{font-size:32px}}
@media print{body{background:white}.controls,#teacherPanel,#animationArea{display:none!important}.panel{box-shadow:none}#seatMap{gap:8px}.seat{break-inside:avoid}}
</style>
</head>
<body>
<h1>🎲 学校用 席替えシステム 完成版</h1>

<div class="panel">
  <div class="controls">
    <button onclick="teacherLogin()">👨‍🏫 教師メニュー</button>
    <button onclick="startLottery()">🔄 席替え実行</button>
    <button onclick="startReveal()">✨ 一人ずつ発表</button>
    <button onclick="togglePresentation()">🎬 発表モード</button>
    <button onclick="print()">🖨️ 印刷</button>
  </div>
</div>

<div id="teacherPanel" class="panel hidden">
  <h2>👨‍🏫 教師設定</h2>
  <p class="note">生徒名簿は不要です。出席番号だけで使えます。固定や禁止設定も番号で入力します。</p>

  <div class="row">
    <div>
      <h3>👥 人数</h3>
      <input type="number" id="studentCount" min="1" max="36" value="35" onchange="resetInvalidSettings();generateStudents();">
    </div>
    <div>
      <h3>🪑 座席数</h3>
      <select id="seatCount" onchange="resetInvalidSettings();buildSeatSelector();generateStudents();">
        <option value="36">36席（6×6）</option>
        <option value="35">35席</option>
        <option value="30">30席</option>
        <option value="25">25席</option>
        <option value="24">24席</option>
      </select>
    </div>
  </div>

  <h3>⬜ 前列固定</h3>
  <input id="frontInput" placeholder="例：1,5,12">

  <h3>📌 固定席</h3>
  <div class="row">
    <div><label>生徒番号</label><select id="fixedStudent"></select></div>
    <div><label>選択席</label><input id="selectedSeatText" readonly placeholder="下の座席をクリック"></div>
  </div>
  <div id="seatSelector"></div>
  <button onclick="addFixedSeat()">固定追加</button>
  <p class="note">固定追加後、生徒番号は自動で次の番号へ進みます。</p>
  <div id="fixedSeatList"></div>

  <h3>🔗 隣同士固定</h3>
  <input id="pairInput" placeholder="例：3,8">
  <button onclick="addPair()">追加</button>
  <div id="pairList"></div>

  <h3>❌ 隣禁止</h3>
  <input id="avoidInput" placeholder="例：7,15">
  <button onclick="addAvoid()">追加</button>
  <div id="avoidList"></div>

  <h3>⚙️ その他</h3>
  <label><input type="checkbox" id="avoidPrevious" checked style="width:auto"> 前回と同じ席をなるべく避ける</label>

  <div class="controls">
    <button onclick="saveSettings()">💾 保存</button>
    <button class="gray" onclick="hideTeacher()">閉じる</button>
    <button class="danger" onclick="clearAll()">全削除</button>
  </div>
</div>

<div id="animationArea" class="hidden"></div>

<div class="legend hidden" id="legend">
  <span>白：通常席</span>
  <span>緑：固定席</span>
  <span>橙：前列固定</span>
  <span>空席：生徒なし</span>
</div>

<div id="seatMap"></div>

<script>
const PASSWORD="1234";
const COLS=6;
let students=[];
let fixedSeats={};
let pairSeats=[];
let avoidPairs=[];
let selectedSeat=null;
let currentResult={};
let animating=false;
let presentation=false;

function teacherLogin(){
  const pass=prompt("教師パスワード");
  if(pass===PASSWORD){
    document.getElementById("teacherPanel").classList.remove("hidden");
    generateStudents();
    buildSeatSelector();
  }else if(pass!==null){
    alert("パスワードが違います");
  }
}
function hideTeacher(){document.getElementById("teacherPanel").classList.add("hidden");}
function getStudentCount(){return Math.max(1,Math.min(36,Number(document.getElementById("studentCount").value||1)));}
function getSeatCount(){return Number(document.getElementById("seatCount").value||36);}

function generateStudents(){
  let count=getStudentCount();
  const seatCount=getSeatCount();
  if(count>seatCount){
    alert("人数が座席数より多いです。人数か座席数を変更してください。");
    document.getElementById("studentCount").value=seatCount;
    count=seatCount;
  }

  students=[];
  for(let i=1;i<=count;i++) students.push(String(i));

  const sel=document.getElementById("fixedStudent");
  const currentValue=sel.value;

  sel.innerHTML="";
  students.forEach(s=>{
    const op=document.createElement("option");
    op.value=s;
    op.textContent=s+"番";
    sel.appendChild(op);
  });

  // プルダウンを作り直しても、選択中の番号をできるだけ保持する
  if(students.includes(currentValue)){
    sel.value=currentValue;
  }
}

function resetInvalidSettings(){
  const count=getStudentCount();
  const seatCount=getSeatCount();
  Object.keys(fixedSeats).forEach(seat=>{
    if(Number(seat)>seatCount||Number(fixedSeats[seat])>count)delete fixedSeats[seat];
  });
  pairSeats=pairSeats.filter(p=>Number(p[0])<=count&&Number(p[1])<=count);
  avoidPairs=avoidPairs.filter(p=>Number(p[0])<=count&&Number(p[1])<=count);
  renderFixedSeats();renderPairs();renderAvoids();
}

function parsePair(text){
  const p=text.split(",").map(v=>v.trim()).filter(v=>v);
  if(p.length!==2)return null;
  if(!students.includes(p[0])||!students.includes(p[1])||p[0]===p[1])return null;
  return p;
}

function buildSeatSelector(){
  const box=document.getElementById("seatSelector");
  box.innerHTML="";
  const count=getSeatCount();
  for(let i=1;i<=count;i++){
    const div=document.createElement("div");
    div.className="selectSeat";
    div.textContent=i;
    div.onclick=()=>selectSeat(i);
    box.appendChild(div);
  }
}

function selectSeat(n){
  selectedSeat=n;
  document.getElementById("selectedSeatText").value="席"+n;
  document.querySelectorAll(".selectSeat").forEach((b,i)=>{
    b.classList.toggle("selectedSeat",i+1===n);
  });
}

function addFixedSeat(){
  const select=document.getElementById("fixedStudent");
  const stu=select.value;

  if(!selectedSeat){
    alert("座席を選択してください");
    return;
  }

  if(!stu){
    alert("生徒番号を選択してください");
    return;
  }

  // 同じ生徒が別の席にすでに固定されていたら、古い固定を消す
  Object.keys(fixedSeats).forEach(seat=>{
    if(fixedSeats[seat]===stu) delete fixedSeats[seat];
  });

  fixedSeats[selectedSeat]=stu;
  renderFixedSeats();

  // 追加後は次の生徒番号へ自動で進める
  if(select.selectedIndex < select.options.length - 1){
    select.selectedIndex = select.selectedIndex + 1;
  }

  selectedSeat=null;
  document.getElementById("selectedSeatText").value="";
  document.querySelectorAll(".selectSeat").forEach(x=>x.classList.remove("selectedSeat"));
}

function renderFixedSeats(){
  const area=document.getElementById("fixedSeatList");
  area.innerHTML="";
  Object.entries(fixedSeats).sort((a,b)=>Number(a[0])-Number(b[0])).forEach(([seat,stu])=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<span>📌 ${stu}番 → 席${seat}</span>`;
    const btn=document.createElement("button");
    btn.className="danger";btn.textContent="削除";
    btn.onclick=()=>{delete fixedSeats[seat];renderFixedSeats();};
    div.appendChild(btn);
    area.appendChild(div);
  });
}

function addPair(){
  generateStudents();
  const pair=parsePair(document.getElementById("pairInput").value);
  if(!pair){alert("例：3,8 の形式で、存在する番号を入力してください");return;}
  pairSeats.push(pair);
  document.getElementById("pairInput").value="";
  renderPairs();
}
function renderPairs(){
  const area=document.getElementById("pairList");
  area.innerHTML="";
  pairSeats.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<span>🔗 ${p[0]}番 ⇔ ${p[1]}番</span>`;
    const btn=document.createElement("button");
    btn.className="danger";btn.textContent="削除";
    btn.onclick=()=>{pairSeats.splice(i,1);renderPairs();};
    div.appendChild(btn);
    area.appendChild(div);
  });
}

function addAvoid(){
  generateStudents();
  const pair=parsePair(document.getElementById("avoidInput").value);
  if(!pair){alert("例：7,15 の形式で、存在する番号を入力してください");return;}
  avoidPairs.push(pair);
  document.getElementById("avoidInput").value="";
  renderAvoids();
}
function renderAvoids(){
  const area=document.getElementById("avoidList");
  area.innerHTML="";
  avoidPairs.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<span>❌ ${p[0]}番 × ${p[1]}番</span>`;
    const btn=document.createElement("button");
    btn.className="danger";btn.textContent="削除";
    btn.onclick=()=>{avoidPairs.splice(i,1);renderAvoids();};
    div.appendChild(btn);
    area.appendChild(div);
  });
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getNeighbors(seat){
  const seatCount=getSeatCount();
  const rows=Math.ceil(seatCount/COLS);
  const r=Math.floor((seat-1)/COLS);
  const c=(seat-1)%COLS;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  const res=[];
  dirs.forEach(([dr,dc])=>{
    const nr=r+dr,nc=c+dc,n=nr*COLS+nc+1;
    if(nr>=0&&nr<rows&&nc>=0&&nc<COLS&&n<=seatCount)res.push(n);
  });
  return res;
}
function findSeat(result,stu){
  for(const [seat,name] of Object.entries(result)){
    if(name===stu)return Number(seat);
  }
  return null;
}
function checkPairs(result){
  for(const p of pairSeats){
    const a=findSeat(result,p[0]),b=findSeat(result,p[1]);
    if(a&&b&&!getNeighbors(a).includes(b))return false;
  }
  return true;
}
function checkAvoids(result){
  for(const p of avoidPairs){
    const a=findSeat(result,p[0]),b=findSeat(result,p[1]);
    if(a&&b&&getNeighbors(a).includes(b))return false;
  }
  return true;
}
function checkPrevious(result){
  if(!document.getElementById("avoidPrevious").checked)return true;
  const prev=JSON.parse(localStorage.getItem("previousSeatsSchool")||"null");
  if(!prev)return true;
  for(const [stu,oldSeat] of Object.entries(prev)){
    if(findSeat(result,stu)===oldSeat)return false;
  }
  return true;
}

function applyFront(result){
  const frontStudents=document.getElementById("frontInput").value.split(",").map(v=>v.trim()).filter(v=>students.includes(v));
  const frontSeats=[];
  for(let i=1;i<=Math.min(12,getSeatCount());i++)frontSeats.push(i);
  frontStudents.forEach(stu=>{
    const current=findSeat(result,stu);
    if(!current||frontSeats.includes(current))return;
    for(const target of frontSeats){
      if(fixedSeats[target])continue;
      const targetStu=result[target];
      if(frontStudents.includes(targetStu))continue;
      result[target]=stu;
      result[current]=targetStu;
      break;
    }
  });
}

function buildResult(){
  generateStudents();
  resetInvalidSettings();
  const seatCount=getSeatCount();
  for(let attempt=0;attempt<1500;attempt++){
    const result={};
    Object.entries(fixedSeats).forEach(([seat,stu])=>{result[seat]=stu;});
    let remain=students.filter(s=>!Object.values(fixedSeats).includes(s));
    shuffle(remain);
    for(let seat=1;seat<=seatCount;seat++){
      if(!result[seat])result[seat]=remain.shift()||"空席";
    }
    applyFront(result);
    if(!checkPairs(result))continue;
    if(!checkAvoids(result))continue;
    if(!checkPrevious(result))continue;
    currentResult=result;
    return result;
  }
  return null;
}

function savePrevious(result){
  const data={};
  Object.entries(result).forEach(([seat,stu])=>{
    if(stu!=="空席")data[stu]=Number(seat);
  });
  localStorage.setItem("previousSeatsSchool",JSON.stringify(data));
}

function draw(result){
  const map=document.getElementById("seatMap");
  map.innerHTML="";
  const frontStudents=document.getElementById("frontInput").value.split(",").map(v=>v.trim()).filter(v=>v);
  const seatCount=getSeatCount();
  for(let i=1;i<=seatCount;i++){
    const stu=result[i]||"空席";
    const div=document.createElement("div");
    div.className="seat";
    if(stu==="空席")div.classList.add("emptySeat");
    if(fixedSeats[i])div.classList.add("fixedSeat");
    if((i<=12||frontStudents.includes(stu))&&!fixedSeats[i])div.classList.add("frontSeat");
    div.innerHTML=`<div class="seatNo">席${i}</div><div class="studentNo">${stu==="空席"?"空席":stu+"番"}</div>`;
    map.appendChild(div);
  }
  document.getElementById("legend").classList.remove("hidden");
}

async function startLottery(){
  hideTeacher();
  if(animating)return;
  const result=buildResult();
  if(!result){alert("条件を満たす席替えが見つかりません。固定や隣条件を少し減らしてください。");return;}

  animating=true;

  const blankResult={};
  for(let i=1;i<=getSeatCount();i++){
    blankResult[i]="?";
  }
  draw(blankResult);

  const area=document.getElementById("animationArea");
  area.classList.remove("hidden");
  area.textContent="抽選中...";

  const numberPool=students.slice();
  numberPool.push("空席");

  // 全席の番号が同時にランダムに動く演出
  for(let frame=0;frame<45;frame++){
    const seats=document.querySelectorAll("#seatMap .seat");

    seats.forEach(seat=>{
      const numEl=seat.querySelector(".studentNo");
      const randomValue=numberPool[Math.floor(Math.random()*numberPool.length)];

      if(numEl){
        numEl.textContent=randomValue==="空席" ? "空席" : randomValue+"番";
      }

      seat.classList.toggle("animating", frame % 2 === 0);
    });

    area.textContent="抽選中" + ".".repeat((frame % 3) + 1);

    const delay = 25 + frame * 4;
    await new Promise(r=>setTimeout(r,delay));
  }

  document.querySelectorAll("#seatMap .seat").forEach(seat=>{
    seat.classList.remove("animating");
  });

  // 最後に一気に本当の結果を表示
  savePrevious(result);
  draw(result);

  area.textContent="✨ 席替え完了！";
  await new Promise(r=>setTimeout(r,900));
  area.classList.add("hidden");

  animating=false;
  saveSettings(false);
}

async function startReveal(){
  hideTeacher();
  if(animating)return;
  const result=buildResult();
  if(!result){alert("条件を満たす席替えが見つかりません。");return;}

  animating=true;

  const blankResult={};
  for(let i=1;i<=getSeatCount();i++){
    blankResult[i]="?";
  }
  draw(blankResult);

  const area=document.getElementById("animationArea");
  area.classList.remove("hidden");
  area.textContent="発表準備中...";

  const numberPool=students.slice();
  numberPool.push("空席");

  // 全席の番号が同時にランダムに動く演出
  for(let frame=0;frame<50;frame++){
    const seats=document.querySelectorAll("#seatMap .seat");

    seats.forEach(seat=>{
      const numEl=seat.querySelector(".studentNo");
      const randomValue=numberPool[Math.floor(Math.random()*numberPool.length)];

      if(numEl){
        numEl.textContent=randomValue==="空席" ? "空席" : randomValue+"番";
      }

      seat.classList.toggle("animating", frame % 2 === 0);
    });

    area.textContent="発表中" + ".".repeat((frame % 3) + 1);

    const delay = 25 + frame * 4;
    await new Promise(r=>setTimeout(r,delay));
  }

  document.querySelectorAll("#seatMap .seat").forEach(seat=>{
    seat.classList.remove("animating");
  });

  // 最後に一気に本当の結果を表示
  savePrevious(result);
  draw(result);

  area.textContent="✨ 完成！";
  await new Promise(r=>setTimeout(r,1000));
  area.classList.add("hidden");

  animating=false;
  saveSettings(false);
}

function togglePresentation(){
  presentation=!presentation;
  document.body.classList.toggle("presentation",presentation);
  if(presentation)hideTeacher();
}

function saveSettings(showAlert=true){
  const data={
    studentCount:document.getElementById("studentCount").value,
    seatCount:document.getElementById("seatCount").value,
    front:document.getElementById("frontInput").value,
    fixedSeats:fixedSeats,
    pairSeats:pairSeats,
    avoidPairs:avoidPairs,
    avoidPrevious:document.getElementById("avoidPrevious").checked
  };
  localStorage.setItem("schoolSeatSettings",JSON.stringify(data));
  if(showAlert)alert("保存しました");
}

function loadSettings(){
  const data=JSON.parse(localStorage.getItem("schoolSeatSettings")||"null");
  if(!data)return;
  document.getElementById("studentCount").value=data.studentCount||35;
  document.getElementById("seatCount").value=data.seatCount||36;
  document.getElementById("frontInput").value=data.front||"";
  fixedSeats=data.fixedSeats||{};
  pairSeats=data.pairSeats||[];
  avoidPairs=data.avoidPairs||[];
  document.getElementById("avoidPrevious").checked=data.avoidPrevious!==false;
}

function clearAll(){
  if(!confirm("保存データと前回座席をすべて削除しますか？"))return;
  localStorage.removeItem("schoolSeatSettings");
  localStorage.removeItem("previousSeatsSchool");
  location.reload();
}

window.addEventListener("load",()=>{
  loadSettings();
  generateStudents();
  buildSeatSelector();
  renderFixedSeats();
  renderPairs();
  renderAvoids();
});
</script>
</body>
</html>
