<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>席替えシステム 完全版</title>

<style>

:root{
 --main:#1976d2;
 --bg:#f4f6f8;
 --card:#ffffff;
 --danger:#d32f2f;
 --fixed:#4caf50;
 --front:#ff9800;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:
 "Yu Gothic",
 "Meiryo",
 sans-serif;
 background:var(--bg);
 padding:20px;
}

h1{
 text-align:center;
 margin-bottom:20px;
}

h3{
 margin-top:15px;
 margin-bottom:10px;
}

.panel{
 background:var(--card);
 border-radius:12px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
 padding:10px 15px;
 border:none;
 border-radius:8px;
 cursor:pointer;
 background:var(--main);
 color:white;
 margin:4px;
 font-size:14px;
}

button:hover{
 opacity:.9;
}

.danger{
 background:var(--danger);
}

textarea,
input,
select{
 width:100%;
 padding:8px;
 margin-top:5px;
 margin-bottom:10px;
}

.hidden{
 display:none;
}

#animationArea{
 text-align:center;
 font-size:48px;
 font-weight:bold;
 min-height:80px;
 margin:30px 0;
 padding:20px;
 background:#fff3cd;
 border-radius:10px;
 border:2px solid #ffc107;
}

#seatMap{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:10px;
 margin-bottom:30px;
}

.seat{
 background:white;
 border:2px solid #ddd;
 border-radius:10px;
 min-height:80px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 font-size:14px;
 transition:all 0.1s ease;
 box-shadow:0 2px 4px rgba(0,0,0,.1);
}

.seat:hover{
 transform:scale(1.05);
 box-shadow:0 4px 8px rgba(0,0,0,.2);
}

.seatNumber{
 font-weight:bold;
 color:#999;
 font-size:12px;
 margin-bottom:5px;
}

.seatName{
 font-weight:bold;
 font-size:16px;
 color:#333;
}

.frontSeat{
 border:3px solid var(--front);
 background:#fff8e1;
}

.fixedSeat{
 border:3px solid var(--fixed);
 background:#e8f5e9;
}

.animating{
 background:#ffeb3b !important;
 border-color:#fbc02d !important;
 box-shadow:0 0 20px rgba(255,193,7,0.8) !important;
 transform:scale(1.1);
}

.legend{
 display:flex;
 gap:30px;
 justify-content:center;
 margin:20px 0;
 padding:15px;
 background:#f5f5f5;
 border-radius:8px;
 flex-wrap:wrap;
}

.legend-item{
 display:flex;
 align-items:center;
 gap:8px;
}

.legend-box{
 width:30px;
 height:30px;
 border:3px solid;
 border-radius:5px;
}

.legend-box.normal{
 background:white;
 border-color:#ddd;
}

.legend-box.fixed{
 background:#e8f5e9;
 border-color:var(--fixed);
}

.legend-box.front{
 background:#fff8e1;
 border-color:var(--front);
}

@media(max-width:700px){

 #seatMap{
  grid-template-columns:repeat(3,1fr);
 }

 body{
  padding:10px;
 }

 .legend{
  gap:15px;
 }

}

#seatSelector{
 display:grid;
 grid-template-columns:repeat(6,60px);
 gap:8px;
 margin-top:10px;
 margin-bottom:10px;
}

.selectSeat{
 width:60px;
 height:60px;
 border:2px solid #999;
 border-radius:8px;
 background:white;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 transition:all 0.2s;
}

.selectSeat:hover{
 background:#e3f2fd;
 transform:scale(1.05);
}

.selectedSeat{
 background:var(--main);
 color:white;
 border-color:var(--main);
}

.controls{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:20px;
}

.controls button{
 flex:1;
 min-width:120px;
}

.presentation-mode {
 background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 color:white;
 text-shadow:1px 1px 2px rgba(0,0,0,0.3);
}

.presentation-mode h1 {
 color:white;
 font-size:48px;
}

.presentation-mode .panel:first-child {
 background:rgba(255,255,255,0.1);
 border:2px solid rgba(255,255,255,0.3);
}

.presentation-mode button {
 background:rgba(255,255,255,0.2);
 border:2px solid white;
 font-weight:bold;
}

.presentation-mode button:hover {
 background:rgba(255,255,255,0.4);
}

</style>
</head>

<body>

<h1>🎲 席替えシステム 完全版</h1>

<div class="panel">

<div class="controls">
<button onclick="teacherLogin()">
👨‍🏫 教師メニュー
</button>

<button onclick="togglePresentationMode()">
🎬 発表モード
</button>

<button onclick="startLottery()">
🔄 席替え実行
</button>

<button onclick="startRevealMode()">
✨ 一人ずつ発表
</button>

<button onclick="printSeats()">
🖨️ 印刷
</button>
</div>

</div>

<div id="teacherPanel"
class="panel">

<h2>👨‍🏫 教師設定</h2>

<label>
教師パスワード
</label>

<input
type="password"
id="passwordInput">

<hr>

<h3>👥 人数設定</h3>

<input
type="number"
id="studentCount"
min="1"
max="36"
value="35">

<button onclick="generateStudents()">
番号生成
</button>

<textarea
id="studentList"
style="display:none"></textarea>
<hr>

<h3>⬜ 前列固定</h3>

<input
id="frontInput"
placeholder="1,5,12">

<hr>

<h3>📌 固定席設定</h3>

<select id="fixedStudent"></select>

<p>
下の座席をクリックして選択
</p>

<div id="seatSelector"></div>

<div>
選択席:
<span id="selectedSeat">
未選択
</span>
</div>

<button onclick="addFixedSeat()">
固定追加
</button>

<div id="fixedSeatList"></div>

<hr>

<h3>🔗 隣同士固定</h3>

<input
id="pairInput"
placeholder="3,8">

<button onclick="addPair()">
追加
</button>

<div id="pairList">
</div>

<hr>

<h3>❌ 隣禁止</h3>

<input
id="avoidInput"
placeholder="7,">

<button onclick="addAvoidPair()">
追加
</button>

<div id="avoidList">
</div>

<hr>

<button onclick="saveSettings()">
💾 保存
</button>

<button
class="danger"
onclick="clearData()">

全削除

</button>

</div>

<div id="animationArea" class="hidden"></div>

<div class="legend hidden" id="legend">
 <div class="legend-item">
  <div class="legend-box normal"></div>
  <span>通常席</span>
 </div>
 <div class="legend-item">
  <div class="legend-box fixed"></div>
  <span>📌 固定席</span>
 </div>
 <div class="legend-item">
  <div class="legend-box front"></div>
  <span>⬜ 前列固定</span>
 </div>
</div>

<div id="seatMap"></div>

<script>

const PASSWORD = "1234";

let fixedSeats = {};
let pairSeats = [];
let avoidPairs = [];
let selectedSeat = null;
let currentResult = {};
let isAnimating = false;
let presentationMode = false;

function teacherLogin(){

 const pass = prompt("教師パスワード");

 if(pass === PASSWORD){

   document
   .getElementById("teacherPanel")
   .style.display = "block";

 }else{

   alert("パスワードが違います");

 }

}

function togglePresentationMode(){

 presentationMode = !presentationMode;

 const body = document.body;
 const teacherPanel = document.getElementById("teacherPanel");
 const controlsBtn = document.querySelectorAll(".controls button");

 if(presentationMode){

   body.classList.add("presentation-mode");
   teacherPanel.classList.add("hidden");

   controlsBtn.forEach(btn=>{
     if(btn.textContent.includes("教師")){
       btn.style.display = "none";
     }
   });

 }else{

   body.classList.remove("presentation-mode");
   teacherPanel.classList.remove("hidden");

   controlsBtn.forEach(btn=>{
     if(btn.textContent.includes("教師")){
       btn.style.display = "inline-block";
     }
   });

 }

}
function generateStudents(){

 const count =
 Number(
 document.getElementById(
 "studentCount"
 ).value
 );

 if(
  count < 1 ||
  count > 36
 ){
   alert("1～36人で入力してください");
   return;
 }

 const students=[];

 for(
  let i=1;
  i<=count;
  i++
 ){
   students.push(
    String(i)
   );
 }

 document
 .getElementById(
 "studentList"
 )
 .value =
 students.join("\n");

 loadStudents();

 alert(
  `${count}人を生成しました`
 );

}
function loadStudents(){

 const names =
 document.getElementById("studentList")
 .value
 .split("\n")
 .map(v=>v.trim())
 .filter(v=>v);

 const select =
 document.getElementById(
 "fixedStudent"
 );

 select.innerHTML="";

 names.forEach(name=>{

   const op =
   document.createElement("option");

   op.value=name;
   op.textContent=name;

   select.appendChild(op);

 });

 alert(
 `${names.length}人を読み込みました`
 );

}

function buildSeatSelector(){

 const container = document.getElementById("seatSelector");
 container.innerHTML = "";

 for(let i=1;i<=36;i++){

   const btn = document.createElement("div");
   btn.className = "selectSeat";
   btn.textContent = i;
   btn.onclick = () => selectSeat(i);

   container.appendChild(btn);

 }

}

function selectSeat(seatNum){

 selectedSeat = seatNum;
 document.getElementById("selectedSeat").textContent = `席${seatNum}`;

 const buttons = document.querySelectorAll(".selectSeat");
 buttons.forEach((btn,idx)=>{

   if(idx+1 === seatNum){
     btn.classList.add("selectedSeat");
   }else{
     btn.classList.remove("selectedSeat");
   }

 });

}

window.addEventListener(
 "load",
 ()=>{

 buildSeatSelector();

 loadSettings();

 generateStudents();

 });
function addFixedSeat(){

 const student =
 document.getElementById(
 "fixedStudent"
 ).value;

 if(!selectedSeat){

   alert(
   "席を選択してください"
   );

   return;

 }

 if(!student)return;

 fixedSeats[selectedSeat]=student;

 renderFixedSeats();

}

function renderFixedSeats(){

 const area =
 document.getElementById(
 "fixedSeatList"
 );

 area.innerHTML="";

 Object.entries(fixedSeats)
 .forEach(([seat,name])=>{

   const div =
   document.createElement("div");

   div.style.marginBottom = "8px";
   div.style.padding = "10px";
   div.style.background = "#e8f5e9";
   div.style.borderLeft = "4px solid var(--fixed)";
   div.style.borderRadius = "4px";

   div.innerHTML=
   `📌 <strong>${name}</strong> → 席${seat}`;

   const btn = document.createElement("button");
   btn.textContent = "削除";
   btn.style.padding = "5px 10px";
   btn.style.marginLeft = "10px";
   btn.style.fontSize = "12px";
   btn.onclick = () => {
     delete fixedSeats[seat];
     renderFixedSeats();
   };

   div.appendChild(btn);
   area.appendChild(div);

 });

}

function addPair(){

 const text =
 document.getElementById(
 "pairInput"
 ).value;

 if(!text.includes(",")){

   alert(
   "山田,鈴木 の形式"
   );

   return;

 }

 const pair =
 text
 .split(",")
 .map(v=>v.trim());

 pairSeats.push(pair);
 document.getElementById("pairInput").value = "";

 renderPairs();

}

function renderPairs(){

 const area =
 document.getElementById(
 "pairList"
 );

 area.innerHTML="";

 pairSeats.forEach((pair,idx)=>{

   const div =
   document.createElement("div");

   div.style.marginBottom = "8px";
   div.style.padding = "10px";
   div.style.background = "#e3f2fd";
   div.style.borderLeft = "4px solid var(--main)";
   div.style.borderRadius = "4px";

   div.textContent=
   `🔗 ${pair[0]} ⇔ ${pair[1]}`;

   const btn = document.createElement("button");
   btn.textContent = "削除";
   btn.style.padding = "5px 10px";
   btn.style.marginLeft = "10px";
   btn.style.fontSize = "12px";
   btn.onclick = () => {
     pairSeats.splice(idx,1);
     renderPairs();
   };

   div.appendChild(btn);
   area.appendChild(div);

 });

}

function addAvoidPair(){

 const text =
 document.getElementById(
 "avoidInput"
 ).value;

 if(!text.includes(",")){

   alert(
   "A,B の形式"
   );

   return;

 }

 const pair =
 text
 .split(",")
 .map(v=>v.trim());

 avoidPairs.push(pair);
 document.getElementById("avoidInput").value = "";

 renderAvoidPairs();

}

function renderAvoidPairs(){

 const area =
 document.getElementById(
 "avoidList"
 );

 area.innerHTML="";

 avoidPairs.forEach((pair,idx)=>{

   const div =
   document.createElement("div");

   div.style.marginBottom = "8px";
   div.style.padding = "10px";
   div.style.background = "#ffebee";
   div.style.borderLeft = "4px solid var(--danger)";
   div.style.borderRadius = "4px";

   div.textContent=
   `❌ ${pair[0]} × ${pair[1]}`;

   const btn = document.createElement("button");
   btn.textContent = "削除";
   btn.style.padding = "5px 10px";
   btn.style.marginLeft = "10px";
   btn.style.fontSize = "12px";
   btn.onclick = () => {
     avoidPairs.splice(idx,1);
     renderAvoidPairs();
   };

   div.appendChild(btn);
   area.appendChild(div);

 });

}

function saveSettings(){

 const data = {

   fixedSeats,
   pairSeats,
   avoidPairs,

 studentCount:
document
.getElementById(
"studentCount"
).value,

   front:
   document
   .getElementById(
   "frontInput"
   ).value

 };

 localStorage.setItem(
 "seatSystemData",
 JSON.stringify(data)
 );

 alert("保存しました");

}



function clearData(){

 if(
 !confirm(function loadSettings(){

 const saved =
 localStorage.getItem(
  "seatSystemData"
 );

 if(!saved){
   generateStudents();
   return;
 }

 const data =
 JSON.parse(saved);

 document.getElementById(
  "studentCount"
 ).value =
 data.studentCount || 35;

 generateStudents();

 fixedSeats =
 data.fixedSeats || {};

 pairSeats =
 data.pairSeats || [];

 avoidPairs =
 data.avoidPairs || [];

 document.getElementById(
  "frontInput"
 ).value =
 data.front || "";

 renderFixedSeats();
 renderPairs();
 renderAvoidPairs();

}
 "すべて削除しますか？"
 )
 ) return;

 localStorage.removeItem(
 "seatSystemData"
 );

 location.reload();

}

function shuffle(arr){

 for(
 let i=arr.length-1;
 i>0;
 i--
 ){

   const j =
   Math.floor(
   Math.random()*(i+1)
   );

   [arr[i],arr[j]]=
   [arr[j],arr[i]];

 }

 return arr;

}

function getNeighbors(seat){

 const row =
 Math.floor((seat-1)/6);

 const col =
 (seat-1)%6;

 const result=[];

 const dirs=[
  [-1,0],
  [1,0],
  [0,-1],
  [0,1]
 ];

 dirs.forEach(d=>{

   const r=row+d[0];
   const c=col+d[1];

   if(
    r>=0 &&
    r<6 &&
    c>=0 &&
    c<6
   ){

     result.push(
      r*6+c+1
     );

   }

 });

 return result;

}

function checkAvoidPairs(result){

 for(const pair of avoidPairs){

   const a=pair[0];
   const b=pair[1];

   let seatA=null;
   let seatB=null;

   Object.entries(result)
   .forEach(([seat,name])=>{

     if(name===a)
      seatA=parseInt(seat);

     if(name===b)
      seatB=parseInt(seat);

   });

   if(
    seatA &&
    seatB
   ){

     const near=
     getNeighbors(
      seatA
     );

     if(
      near.includes(
       seatB
      )
     ){

       return false;

     }

   }

 }

 return true;

}

function checkPairSeats(result){

 for(const pair of pairSeats){

   const a=pair[0];
   const b=pair[1];

   let seatA=null;
   let seatB=null;

   Object.entries(result)
   .forEach(([seat,name])=>{

     if(name===a)
      seatA=parseInt(seat);

     if(name===b)
      seatB=parseInt(seat);

   });

   if(
    seatA &&
    seatB
   ){

     const near=
     getNeighbors(
      seatA
     );

     if(
      !near.includes(
       seatB
      )
     ){

       return false;

     }

   }

 }

 return true;

}

function checkPreviousSeats(result){

 const saved=
 localStorage.getItem(
 "previousSeats"
 );

 if(!saved)
  return true;

 const prev=
 JSON.parse(saved);

 for(
  const name
  in prev
 ){

   const oldSeat=
   prev[name];

   let newSeat=null;

   Object.entries(result)
   .forEach(([seat,n])=>{

     if(n===name){

       newSeat=
       parseInt(seat);

     }

   });

   if(
    oldSeat===newSeat
   ){

     return false;

   }

 }

 return true;

}

function savePreviousSeats(result){

 const data={};

 Object.entries(result)
 .forEach(([seat,name])=>{

   if(name){

     data[name]=
     parseInt(seat);

   }

 });

 localStorage.setItem(
 "previousSeats",
 JSON.stringify(data)
 );

}

function buildSeatResult(){

 const names=
 document
 .getElementById(
 "studentList"
 )
 .value
 .split("\n")
 .map(v=>v.trim())
 .filter(v=>v);

 const frontStudents=
 document
 .getElementById(
 "frontInput"
 )
 .value
 .split(",")
 .map(v=>v.trim())
 .filter(v=>v);

 let attempt=0;

 while(attempt<500){

   attempt++;

   const result={};

   Object.entries(
    fixedSeats
   ).forEach(
   ([seat,name])=>{

     result[seat]=name;

   });

   let remain=
   names.filter(name=>
   !Object.values(
    fixedSeats
   ).includes(name)
   );

   shuffle(remain);

   for(
    let seat=1;
    seat<=36;
    seat++
   ){

     if(
      !result[seat]
     ){

       result[seat]=
       remain.shift() || "";

     }

   }

   frontStudents.forEach(
   student=>{

     let currentSeat=
     null;

     Object.entries(
      result
     ).forEach(
     ([seat,name])=>{

       if(
        name===student
       ){

         currentSeat=
         parseInt(seat);

       }

     });

     if(
      currentSeat &&
      currentSeat>12
     ){

       for(
        let target=1;
        target<=12;
        target++
       ){

         if(
          !frontStudents.includes(
           result[target]
          )
         ){

           const tmp=
           result[target];

           result[target]=
           student;

           result[currentSeat]=
           tmp;

           break;

         }

       }

     }

   });

   if(
    !checkPairSeats(
      result
    )
   ) continue;

   if(
    !checkAvoidPairs(
      result
    )
   ) continue;

   if(
    !checkPreviousSeats(
      result
    )
   ) continue;

   currentResult=result;
   return result;

 }

 return null;

}

function renderSeatMap(result){

 const map =
 document.getElementById(
 "seatMap"
 );

 map.innerHTML="";

 for(let i=1;i<=36;i++){

   const seat =
   document.createElement("div");

   seat.className="seat";

   let isFrontSeat=false;
   let isFixedSeat=false;

   const frontInput=
   document
   .getElementById("frontInput")
   .value
   .split(",")
   .map(v=>v.trim())
   .filter(v=>v);

   const studentName=result[i]||"";

   if(
    fixedSeats[i]
   ){

     isFixedSeat=true;

   }

   if(i<=12 || frontInput.includes(studentName)){

     isFrontSeat=true;

   }

   if(isFixedSeat){
     seat.classList.add("fixedSeat");
   }

   if(isFrontSeat && !isFixedSeat){
     seat.classList.add("frontSeat");
   }

   seat.innerHTML=`
     <div class="seatNumber">席${i}</div>
     <div class="seatName">${studentName}</div>
   `;

   map.appendChild(seat);

 }

}

function startLottery(){

 if(isAnimating) return;

 const result = buildSeatResult();

 if(!result){

   alert("条件を満たす席替えが見つかりません");
   return;

 }

 isAnimating = true;

 savePreviousSeats(result);
 renderSeatMap(result);
 
 document.getElementById("legend").classList.remove("hidden");

 isAnimating = false;

}

async function startRevealMode(){

 if(isAnimating) return;

 const result = buildSeatResult();

 if(!result){

   alert("条件を満たす席替えが見つかりません");
   return;

 }

 isAnimating = true;
 savePreviousSeats(result);
 renderSeatMap(result);

 const animArea = document.getElementById("animationArea");
 animArea.classList.remove("hidden");

 const seatArray = Array.from({length:36}, (_,i)=>i+1);

 // ランダム演出を3ループ
 const loopCount = 3;

 for(let loop=0; loop<loopCount; loop++){

   shuffle(seatArray);

   for(const seatNum of seatArray){

     animArea.textContent = `席 ${seatNum}`;

     const seatElem = document.querySelector(`.seat:nth-child(${seatNum})`);
     if(seatElem){
       seatElem.classList.add("animating");
     }

     await new Promise(resolve=>setTimeout(resolve, 150));

     if(seatElem){
       seatElem.classList.remove("animating");
     }

   }

 }

 animArea.textContent = "✨ 完成！";
 animArea.style.fontSize = "60px";

 await new Promise(resolve=>setTimeout(resolve, 1500));

 animArea.classList.add("hidden");
 animArea.style.fontSize = "48px";

 document.getElementById("legend").classList.remove("hidden");

 isAnimating = false;

}

function printSeats(){

 window.print();

}

</script>

</body>
</html>
